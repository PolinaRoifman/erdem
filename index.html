<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Станция Эрдем · сеанс связи</title>
<style>
:root{--bg:#07100b;--panel:#0d1a12;--line:#1b3324;--fg:#8fe6a0;--dim:#4a7a58;--bad:#ff7a68;
 --btn:#102a19;--btnh:#173d25;--mono:"Courier New",Courier,ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 padding-block:20px 28px;display:flex;align-items:center;justify-content:center}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
 background:repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}
.wrap{width:100%;max-width:460px}
h1{font-size:clamp(15px,4.4vw,18px);letter-spacing:.18em;text-transform:uppercase;margin:0 0 4px}
.sub{color:var(--dim);font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.post{border:1px solid var(--line);background:var(--panel);padding:16px}
label{color:var(--dim);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;display:block}
.val{font-size:clamp(30px,11vw,46px);letter-spacing:.06em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.st{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.bar{height:8px;border:1px solid var(--line);background:#060d08}
.bar i{display:block;height:100%;background:var(--fg);width:0}
button{width:100%;margin-top:14px;padding:18px;font-family:var(--mono);font-size:15px;letter-spacing:.12em;
 text-transform:uppercase;background:var(--btn);color:var(--fg);border:1px solid var(--fg);cursor:pointer}
button:hover{background:var(--btnh)} button:active{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#msg{margin-top:14px;border:1px solid var(--line);background:#060d08;padding:11px;font-size:13px;line-height:1.5}
.hid{display:none}
.hid.on{display:block;width:100%;margin-top:14px;padding:12px;font-family:var(--mono);font-size:20px;letter-spacing:8px;text-align:center;background:#060d08;color:var(--fg);border:1px solid var(--fg)}
.lost{--fg:#ff7a68;--line:#4a1c16;--panel:#1a0b09;--bg:#140605;--btn:#2b0f0c;--btnh:#3d1511;--dim:#a35a4e}
</style></head><body>
<div class="wrap">
  <h1>Станция «Эрдем» · связь с зондом</h1>
  <div class="sub">Амактай · зонд «Сазерак-5» · канал дальней связи</div>
  <div class="post">
    <label>Состояние канала</label>
    <div class="st" id="st">сеанс не проведён</div>
    <label>До следующего сеанса</label>
    <div class="val" id="left">—</div>
    <div class="bar"><i id="pbar"></i></div>
    <button id="b">Провести сеанс связи</button>
  </div>
  <div id="msg">Смена начата. Сеанс связи проводится не реже одного раза в десять минут.</div>
  <input id="k" class="hid" inputmode="numeric" maxlength="4" autocomplete="off" aria-hidden="true">
</div>
<script>
(function(){
  var TTL=600000,KEY='erdem-session',S={at:0,lost:false};
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  // смена начинается с открытия страницы: не нажимать нельзя
  if(!S.at&&!S.lost){S.at=Date.now();save();}
  function two(n){return(n<10?'0':'')+n}
  function draw(){
    var left=S.at?S.at+TTL-Date.now():0;
    if(S.at&&left<=0)S.lost=true;
    document.body.classList.toggle('lost',S.lost);
    var st=document.getElementById('st'),lf=document.getElementById('left');
    if(S.lost){st.textContent='связь потеряна';lf.textContent='00:00';
      document.getElementById('pbar').style.width='0';
      document.getElementById('msg').textContent='Связь потеряна: сеанс не проведён в течение десяти минут. Станция передала в эфир сигнал сбоя, его приняли обсерватории СРГ. Покажите экран Секретарю.';}
    else if(!S.at){st.textContent='смена начата';lf.textContent='10:00';document.getElementById('pbar').style.width='100%';}
    else{st.textContent='канал устойчив';
      lf.textContent=two(Math.floor(left/60000))+':'+two(Math.floor(left%60000/1000));
      document.getElementById('pbar').style.width=(left/TTL*100)+'%';
      document.getElementById('msg').textContent=left<120000?'Меньше двух минут до сеанса.':'Сеанс связи проводится не реже одного раза в десять минут.';}
  }
  document.getElementById('b').onclick=function(){
    if(S.lost)return;
    S.at=Date.now();save();draw();
  };
  // сброс: удержать заголовок 6 секунд, затем ввести код
  var hold=0,k=document.getElementById('k'),h1=document.querySelector('h1');
  function armed(){k.classList.add('on');k.value='';k.focus();}
  function disarm(){k.classList.remove('on');k.value='';k.blur();}
  h1.addEventListener('pointerdown',function(){clearTimeout(hold);hold=setTimeout(armed,6000);});
  ['pointerup','pointerleave','pointercancel'].forEach(function(e){h1.addEventListener(e,function(){clearTimeout(hold);});});
  h1.addEventListener('contextmenu',function(e){e.preventDefault();});
  k.addEventListener('input',function(){
    if(k.value.length<4)return;
    if(k.value==='1967'){S={at:Date.now(),lost:false};save();draw();document.getElementById('msg').textContent='Смена начата заново.';}
    disarm();
  });
  k.addEventListener('blur',disarm);
  draw();setInterval(draw,500);
})();
</script></body></html>
